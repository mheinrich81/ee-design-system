<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4px base · 1–24 token scale" viewport="700x200" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--snow); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .name { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--granite-950); }
  .desc { font-family: var(--font-sans); font-size: 13px; color: var(--granite-500); }
  .row { display: flex; align-items: flex-end; gap: 10px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--summit-200); border-radius: 3px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--granite-600); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--granite-400); }
</style></head>
<body>
  <div class="head">
    <div class="name">Spacing scale <span style="font-family:var(--font-mono);font-size:11px;color:var(--granite-400);margin-left:8px;">— 4px base</span></div>
    <div class="desc">space-1 … space-24</div>
  </div>
  <div class="row">
    <div class="item"><div class="bar" style="width:4px;height:4px"></div><div class="tag">1</div><div class="px">4</div></div>
    <div class="item"><div class="bar" style="width:8px;height:8px"></div><div class="tag">2</div><div class="px">8</div></div>
    <div class="item"><div class="bar" style="width:12px;height:12px"></div><div class="tag">3</div><div class="px">12</div></div>
    <div class="item"><div class="bar" style="width:16px;height:16px"></div><div class="tag">4</div><div class="px">16</div></div>
    <div class="item"><div class="bar" style="width:20px;height:20px"></div><div class="tag">5</div><div class="px">20</div></div>
    <div class="item"><div class="bar" style="width:24px;height:24px"></div><div class="tag">6</div><div class="px">24</div></div>
    <div class="item"><div class="bar" style="width:32px;height:32px"></div><div class="tag">8</div><div class="px">32</div></div>
    <div class="item"><div class="bar" style="width:40px;height:40px"></div><div class="tag">10</div><div class="px">40</div></div>
    <div class="item"><div class="bar" style="width:48px;height:48px"></div><div class="tag">12</div><div class="px">48</div></div>
    <div class="item"><div class="bar" style="width:64px;height:64px"></div><div class="tag">16</div><div class="px">64</div></div>
    <div class="item"><div class="bar" style="width:80px;height:80px"></div><div class="tag">20</div><div class="px">80</div></div>
    <div class="item"><div class="bar" style="width:96px;height:96px"></div><div class="tag">24</div><div class="px">96</div></div>
  </div>
</body></html>
