<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Wordmark + mark + light/dark variants" viewport="700x130" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--snow); }
  .row { display: flex; align-items: center; gap: 40px; }
  .mark { display: flex; align-items: center; gap: 16px; }
  .mark img { width: 64px; height: 64px; }
  .word { display: flex; flex-direction: column; line-height: 1; }
  .word .name { font-family: var(--font-display); font-size: 40px; font-weight: 400; letter-spacing: 0; color: var(--granite-950); }
  .word .sub  { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.32em; color: var(--summit-600); margin-top: 8px; text-transform: uppercase; }
  .variants { display: flex; gap: 24px; align-items: center; padding-left: 40px; border-left: 1px solid var(--granite-200); }
  .chip { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: var(--radius-md); }
  .chip.light { background: var(--snow); border: 1px solid var(--granite-200); }
  .chip.dark { background: var(--granite-950); }
  .chip img { width: 38px; height: 38px; }
  .chip.outline-light { background: var(--snow); border: 1px solid var(--granite-200); color: var(--granite-950); }
  .chip.outline-dark  { background: var(--granite-950); color: var(--snow); }
  .chip svg { width: 38px; height: 38px; display: block; }
</style></head>
<body>
  <div class="row">
    <div class="mark">
      <img src="../assets/logo-mark.svg" alt="Mark">
      <div class="word">
        <div class="name">Elevate</div>
        <div class="sub">EXECUTION</div>
      </div>
    </div>
    <div class="variants">
      <div class="chip light"><img src="../assets/logo-mark.svg"></div>
      <div class="chip dark"><img src="../assets/logo-mark.svg"></div>
      <div class="chip outline-light">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 50 L20 22 L30 38 L44 12 L60 50"/><path d="M17 28 L20 22 L23 28"/><path d="M41 18 L44 12 L47 18"/></svg>
      </div>
      <div class="chip outline-dark">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 50 L20 22 L30 38 L44 12 L60 50"/><path d="M17 28 L20 22 L23 28"/><path d="M41 18 L44 12 L47 18"/></svg>
      </div>
    </div>
  </div>
</body></html>
