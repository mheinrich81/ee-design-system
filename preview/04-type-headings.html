  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--granite-400); text-align: right; }

  <div class="row"><div class="tag">H3</div><h3 style="margin:0">The operating layer for teams</h3><div class="meta">Wicky Javick · 30 / 1.25</div></div>
