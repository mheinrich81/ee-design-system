<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="sm · md · lg · xl · 2xl · full" viewport="700x190" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--snow); display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 88px; height: 88px; background: var(--summit-100); border: 1px solid var(--summit-300); }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--granite-700); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--granite-400); }
</style></head>
<body>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="label">sm</div><div class="px">6 — inputs · chips</div></div>
  <div class="item"><div class="box" style="border-radius:10px"></div><div class="label">md</div><div class="px">10 — buttons · menu</div></div>
  <div class="item"><div class="box" style="border-radius:14px"></div><div class="label">lg</div><div class="px">14 — cards · modals</div></div>
  <div class="item"><div class="box" style="border-radius:22px"></div><div class="label">xl</div><div class="px">22 — hero · illus</div></div>
  <div class="item"><div class="box" style="border-radius:32px"></div><div class="label">2xl</div><div class="px">32 — feature</div></div>
  <div class="item"><div class="box" style="border-radius:999px"></div><div class="label">full</div><div class="px">— pills · avatars</div></div>
</body></html>
