<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Success · warning · danger · info" viewport="700x150" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--snow); display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .item { border-radius: 14px; overflow: hidden; border: 1px solid var(--granite-200); }
  .head { padding: 12px 14px; display: flex; align-items: center; gap: 8px; font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .body { padding: 10px 14px 14px; font-family: var(--font-mono); font-size: 11px; line-height: 1.6; }
  .body div { display: flex; justify-content: space-between; color: var(--granite-700); }
</style></head>
<body>
  <div class="item" style="background:var(--success-bg)"><div class="head" style="color:var(--pine-800)"><span class="dot" style="background:var(--success)"></span>Success</div><div class="body"><div>fg<span>pine-500</span></div><div>bg<span>pine-50</span></div></div></div>
  <div class="item" style="background:var(--warning-bg)"><div class="head" style="color:var(--alpenglow-800)"><span class="dot" style="background:var(--warning)"></span>Warning</div><div class="body"><div>fg<span>alpenglow-500</span></div><div>bg<span>alpenglow-50</span></div></div></div>
  <div class="item" style="background:var(--danger-bg)"><div class="head" style="color:oklch(40% 0.180 28)"><span class="dot" style="background:var(--danger)"></span>Danger</div><div class="body"><div>fg<span>danger-500</span></div><div>bg<span>danger-50</span></div></div></div>
  <div class="item" style="background:var(--info-bg)"><div class="head" style="color:var(--summit-800)"><span class="dot" style="background:var(--info)"></span>Info</div><div class="body"><div>fg<span>summit-500</span></div><div>bg<span>summit-50</span></div></div></div>
</body></html>
