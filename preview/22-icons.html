<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Icon set" subtitle="Lucide · 24 brand-relevant glyphs" viewport="700x230" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 22px 28px; background: var(--snow); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .name { font-family: var(--font-display); font-size: 20px; font-weight: 500; color: var(--granite-950); }
  .desc { font-family: var(--font-sans); font-size: 12px; color: var(--granite-500); }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ic [data-lucide] { width: 22px; height: 22px; color: var(--granite-800); stroke-width: 1.5; }
  .ic span { font-family: var(--font-mono); font-size: 10px; color: var(--granite-500); }
</style></head>
<body>
  <div class="head">
    <div class="name">Iconography <span style="font-family:var(--font-mono);font-size:11px;color:var(--granite-400);margin-left:8px;">— Lucide · 1.5px stroke</span></div>
    <div class="desc">currentColor · 24/20/16 sizes</div>
  </div>
  <div class="grid">
    <div class="ic"><i data-lucide="mountain-snow"></i><span>summit</span></div>
    <div class="ic"><i data-lucide="target"></i><span>target</span></div>
    <div class="ic"><i data-lucide="check-square"></i><span>decision</span></div>
    <div class="ic"><i data-lucide="flag"></i><span>milestone</span></div>
    <div class="ic"><i data-lucide="users"></i><span>owners</span></div>
    <div class="ic"><i data-lucide="calendar"></i><span>calendar</span></div>
    <div class="ic"><i data-lucide="trending-up"></i><span>progress</span></div>
    <div class="ic"><i data-lucide="alert-triangle"></i><span>at-risk</span></div>
    <div class="ic"><i data-lucide="message-square"></i><span>comment</span></div>
    <div class="ic"><i data-lucide="search"></i><span>search</span></div>
    <div class="ic"><i data-lucide="settings"></i><span>settings</span></div>
    <div class="ic"><i data-lucide="filter"></i><span>filter</span></div>
    <div class="ic"><i data-lucide="arrow-up-right"></i><span>open</span></div>
    <div class="ic"><i data-lucide="plus"></i><span>add</span></div>
    <div class="ic"><i data-lucide="check"></i><span>done</span></div>
    <div class="ic"><i data-lucide="x"></i><span>close</span></div>
    <div class="ic"><i data-lucide="bell"></i><span>alerts</span></div>
    <div class="ic"><i data-lucide="bookmark"></i><span>save</span></div>
    <div class="ic"><i data-lucide="link"></i><span>link</span></div>
    <div class="ic"><i data-lucide="paperclip"></i><span>attach</span></div>
    <div class="ic"><i data-lucide="layout-dashboard"></i><span>overview</span></div>
    <div class="ic"><i data-lucide="git-branch"></i><span>fork</span></div>
    <div class="ic"><i data-lucide="zap"></i><span>action</span></div>
    <div class="ic"><i data-lucide="archive"></i><span>archive</span></div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
