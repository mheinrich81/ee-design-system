<!DOCTYPE html>
<!-- @dsCard group="Components" name="Form inputs" subtitle="Text · search · select · checkbox" viewport="700x230" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--snow); display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; align-items: end; }
  label { display: block; font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--granite-700); margin-bottom: 6px; }
  .field { position: relative; }
  input, select { width: 100%; box-sizing: border-box; font-family: var(--font-sans); font-size: 14px; padding: 10px 12px; border: 1px solid var(--granite-200); border-radius: 8px; background: white; color: var(--granite-900); outline: none; transition: box-shadow var(--dur-base) var(--ease-summit), border-color var(--dur-base) var(--ease-summit); }
  input:focus, select:focus { border-color: var(--summit-500); box-shadow: var(--ring-focus); }
  .with-icon input { padding-left: 36px; }
  .with-icon [data-lucide] { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--granite-500); stroke-width: 1.75; }
  .check { display: flex; align-items: center; gap: 10px; font-family: var(--font-sans); font-size: 14px; color: var(--granite-900); }
  .check input { appearance: none; width: 16px; height: 16px; border: 1.5px solid var(--granite-400); border-radius: 4px; cursor: pointer; padding: 0; display: grid; place-items: center; flex: 0 0 16px; }
  .check input:checked { background: var(--summit-500); border-color: var(--summit-500); }
  .check input:checked::after { content: ""; width: 8px; height: 8px; background: white; clip-path: polygon(20% 50%, 0 65%, 38% 100%, 100% 22%, 80% 8%, 38% 70%); }
  .help { font-family: var(--font-sans); font-size: 12px; color: var(--granite-500); margin-top: 4px; }
</style></head>
<body>
  <div>
    <label>Initiative name</label>
    <input value="Q3 platform reliability">
    <div class="help">Used in URLs and notifications.</div>
  </div>
  <div>
    <label>Search</label>
    <div class="field with-icon"><i data-lucide="search"></i><input placeholder="Search initiatives, owners, decisions"></div>
  </div>
  <div>
    <label>Owner</label>
    <select><option>Mira Singh</option><option>Adetola O.</option></select>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;">
    <div class="check"><input type="checkbox" checked> Notify owner when blocked</div>
    <div class="check"><input type="checkbox"> Roll up to parent OKR</div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
