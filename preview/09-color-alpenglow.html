<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Alpenglow Gold" subtitle="Muted accent gold · use sparingly" viewport="700x160" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--snow); }
  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .name { font-family: var(--font-display); font-size: 22px; font-weight: 500; color: var(--granite-950); }
  .desc { font-family: var(--font-sans); font-size: 13px; color: var(--granite-500); }
  .ramp { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; }
  .sw { aspect-ratio: 1.4 / 1; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.9); }
  .sw.lite { color: oklch(20% 0.012 285); }
</style></head>
<body>
  <div class="head">
    <div class="name">Alpenglow Gold <span style="font-family:var(--font-mono);font-size:11px;color:var(--granite-400);margin-left:8px;">— accent only</span></div>
    <div class="desc">Sunrise on the high snow · use sparingly</div>
  </div>
  <div class="ramp">
    <div class="sw lite" style="background:var(--alpenglow-50)">50</div>
    <div class="sw lite" style="background:var(--alpenglow-100)">100</div>
    <div class="sw lite" style="background:var(--alpenglow-200)">200</div>
    <div class="sw lite" style="background:var(--alpenglow-300)">300</div>
    <div class="sw lite" style="background:var(--alpenglow-400);outline:2px solid var(--granite-950);outline-offset:2px">400</div>
    <div class="sw lite" style="background:var(--alpenglow-500)">500</div>
    <div class="sw" style="background:var(--alpenglow-600)">600</div>
    <div class="sw" style="background:var(--alpenglow-700)">700</div>
    <div class="sw" style="background:var(--alpenglow-800)">800</div>
    <div class="sw" style="background:var(--alpenglow-900)">900</div>
    <div class="sw" style="background:var(--alpenglow-950)">950</div>
  </div>
</body></html>
