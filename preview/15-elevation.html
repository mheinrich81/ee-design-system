<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Three-tier colored shadow system" viewport="700x200" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 30px 28px; background: var(--snow); display: flex; gap: 36px; align-items: center; justify-content: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .box { width: 130px; height: 90px; background: white; border-radius: 14px; }
  .b1 { box-shadow: var(--elev-1); }
  .b2 { box-shadow: var(--elev-2); }
  .b3 { box-shadow: var(--elev-3); }
  .label { font-family: var(--font-mono); font-size: 12px; color: var(--granite-700); }
  .desc { font-family: var(--font-sans); font-size: 11px; color: var(--granite-500); }
</style></head>
<body>
  <div class="item"><div class="box b1"></div><div class="label">elev-1</div><div class="desc">cards at rest</div></div>
  <div class="item"><div class="box b2"></div><div class="label">elev-2</div><div class="desc">menus · hover</div></div>
  <div class="item"><div class="box b3"></div><div class="label">elev-3</div><div class="desc">modals · palette</div></div>
</body></html>
