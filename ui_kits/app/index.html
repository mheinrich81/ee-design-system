<!DOCTYPE html>
<!-- @dsCard group="UI Kit — App" name="Chief-of-staff workspace (exploratory)" subtitle="Sidebar · KPIs · initiatives · decisions for CoS · ⌘K palette" viewport="1440x800" -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Elevate Execution — CoS morning view</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="morning-view.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="TopBar.jsx"></script>
  <script type="text/babel" src="MorningView.jsx"></script>
  <script type="text/babel" src="CommandPalette.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "state": "healthy"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [paletteOpen, setPaletteOpen] = React.useState(false);

      React.useEffect(() => {
        function onKey(e) {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setPaletteOpen((o) => !o);
          } else if (e.key === 'Escape') {
            setPaletteOpen(false);
          }
        }
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      React.useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      return (
        <div className="app-shell" data-screen-label="01 CoS Morning View">
          <Sidebar />
          <div className="app-main">
            <TopBar />
            <MorningView state={tweaks.state} />
          </div>
          <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} />

          <TweaksPanel title="Morning view">
            <TweakSection label="Signal load">
              <TweakRadio
                label="State"
                value={tweaks.state}
                options={[
                  { value: "empty",      label: "Empty" },
                  { value: "healthy",    label: "Healthy" },
                  { value: "elevated",   label: "Elevated" },
                  { value: "overloaded", label: "Overloaded" },
                ]}
                onChange={(v) => setTweak('state', v)}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
